name: Backend Tests

on:
  workflow_dispatch:  # manual trigger only until production is ready
  # Uncomment below to auto-run on push/PR:
  # push:
  #   branches: [main]
  #   paths: ['backend/**']
  # pull_request:
  #   branches: [main]
  #   paths: ['backend/**']

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
      SECRET_KEY: ci-test-secret-key-not-for-production
      FIRST_SUPERUSER: admin@test.com
      FIRST_SUPERUSER_PASSWORD: testadminpassword
      OPENAI_API_KEY: sk-fake-key-for-ci
      GOOGLE_MAPS_API_KEY: fake-key
      PINECONE_API_KEY: fake-key

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: backend
        run: uv sync --dev

      - name: Run tests
        working-directory: backend
        run: uv run python -m pytest tests/ -v --tb=short
