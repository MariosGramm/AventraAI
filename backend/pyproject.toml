[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
  "fastapi[standard]>=0.114.2,<1.0.0",
  "alembic>=1.12.1,<2.0.0",
  "httpx>=0.25.1,<1.0.0",
  "jinja2<4.0.0,>=3.1.4",
  "psycopg[binary]<4.0.0,>=3.1.13",
  "pydantic>2.0",
  "pydantic-settings>=2.2.1,<3.0.0",
  "pyjwt<3.0.0,>=2.8.0",
  "python-multipart<1.0.0,>=0.0.27",
  "sqlmodel<1.0.0,>=0.0.21",
  "tenacity<9.0.0,>=8.2.3",
  "email-validator<3.0.0.0,>=2.1.0.post1",
  "emails<1.0,>=0.6",
  "pwdlib[argon2,bcrypt]>=0.3.0",
  "sentry-sdk[fastapi]>=2.0.0,<3.0.0",
  "python-dotenv>=1.0.0",
  "requests>=2.34.2",
  "langchain-openai>=1.3.3",
  "langchain-text-splitters>=1.1.2",
  "langchain-community>=0.4.2",
  "markdown>=3.10.3",
  "langchain>=1.3.11",
  "langgraph>=1.2.6",
  "langchain-classic>=1.0.8",
  "resend>=2.36.0",
  "google-auth>=2.56.3",
  "stripe>=15.5.0",
  "fpdf2>=2.8.8",
  "langchain-pinecone>=0.2.13",
  "pinecone-client>=6.0.0",
  "cachetools>=7.1.4",
]

[dependency-groups]
dev = [
  "coverage<8.0.0,>=7.4.3",
  "mypy<2.0.0,>=1.8.0",
  "pytest>=7.4.3,<8.0.0",
  "pytest-asyncio>=0.23.8",
  "ruff<1.0.0,>=0.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[tool.ruff]
target-version = "py310"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "B",
  "C4",
  "UP",
  "ARG001",
  "T201",
]
ignore = [
  "E501",
  "B008",
  "W191",
  "B904",
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ty.terminal]
error-on-warning = true
